<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Checker App</title>

  <script src="https://cdn.tailwindcss.com"></script>


  <!-- Custom CSS -->
  <link rel="stylesheet" href="tailwind.css" />
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

  <!-- App Container -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    
    <!-- Header -->
    <header class="text-center mb-6">
      <h1 class="text-3xl font-bold text-secondary">Weather Checker</h1>
      <p class="text-gray-500 mt-1 text-sm">
        Check real-time weather conditions
      </p>
    </header>

    <!-- Search Section -->
    <section class="flex gap-2 mb-6">
      <input
        type="text"
        id="cityInput"
        placeholder="Enter city name"
        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
      />
      <button
        id="checkWeatherBtn"
        class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition"
      >
        Search
      </button>
    </section>

    <!-- Status Message -->
    <div
      id="statusMessage"
      class="text-center text-sm text-gray-500 mb-4 hidden"
    >
      Loading weather data...
    </div>

    <!-- Error Message -->
    <div
      id="errorMessage"
      class="text-center text-sm text-red-500 mb-4 hidden"
    >
      City not found. Please try again.
    </div>

    <!-- Weather Result -->
    <section
      id="weatherResult"
      class="hidden bg-slate-50 rounded-xl p-6 text-center"
    >
      <h2 id="cityName" class="text-xl font-semibold text-secondary">
        Kigali
      </h2>

      <p id="weatherDescription" class="text-gray-600 capitalize mt-1">
        clear sky
      </p>

      <div class="flex justify-around mt-6">
        <div>
          <p class="text-sm text-gray-500">Temperature</p>
          <p id="temperature" class="text-lg font-bold">25°C</p>
        </div>

        <div>
          <p class="text-sm text-gray-500">Humidity</p>
          <p id="humidity" class="text-lg font-bold">60%</p>
        </div>

        <div>
          <p class="text-sm text-gray-500">Wind</p>
          <p id="windSpeed" class="text-lg font-bold">10 km/h</p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="text-center mt-6 text-xs text-gray-400">
      Built for learning callbacks, promises & async/await
    </footer>
  </div>

  <!-- JavaScript File (you will create this) -->
  <script src="script.js"></script>
</body>
</html>
