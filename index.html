<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Checker App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            secondary: '#1e293b',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    
    <header class="text-center mb-6">
      <h1 class="text-3xl font-bold text-secondary">Weather Checker</h1>
      <p class="text-gray-900 mt-1 text-sm">
        Check real-time weather conditions
      </p>
    </header>

    <section class="flex gap-2 mb-6">
      <input type="text" id="cityInput" placeholder="Enter city name"
         class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
      />
      <button id="checkWeatherBtn" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
          Search
      </button>
    </section>

    <div id="statusMessage" class="text-center text-sm text-gray-500 mb-4 hidden">
      Loading weather data...
    </div>

    <div id="errorMessage" class="text-center text-sm text-red-500 mb-4 hidden">
      City not found. Please try again.
    </div>

    <section id="weatherResult" class="hidden bg-slate-50 rounded-xl p-6 text-center">
      <h2 id="cityName" class="text-xl font-semibold text-secondary">
        Kigali
      </h2>

      <p id="weatherDescription" class="text-gray-600 capitalize mt-1">
        clear sky
      </p>

      <div class="flex justify-around mt-6">
        <div>
          <p class="text-sm text-gray-500">Temperature</p>
          <p id="temperature" class="text-lg font-bold">25°C</p>
        </div>

        <div>
          <p class="text-sm text-gray-500">Humidity</p>
          <p id="humidity" class="text-lg font-bold">60%</p>
        </div>

        <div>
          <p class="text-sm text-gray-500">Wind</p>
          <p id="windSpeed" class="text-lg font-bold">10 km/h</p>
        </div>
      </div>
    </section>

    <footer class="text-center mt-6 text-xs text-gray-900">
      Check the weather anywhere, anytime!
    </footer>
  </div>

  <script>
    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('checkWeatherBtn');
    const weatherResult = document.getElementById('weatherResult');
    const statusMessage = document.getElementById('statusMessage');
    const errorMessage = document.getElementById('errorMessage');

    searchBtn.addEventListener('click', () => {
      const city = cityInput.value.trim();
      if (city) {
        getWeather(city);
      }
    });

    async function getWeather(city) {
      showLoading();
      const simulateApiCall = new Promise((resolve, reject) => {
        setTimeout(() => {
          if (city.toLowerCase() === 'error') {
            reject(new Error("City not found"));
          } else {
            const dummyData = {
              name: city.charAt(0).toUpperCase() + city.slice(1),
              sys: { country: "TEST" },
              weather: [{ description: "sunny with mock clouds" }],
              main: { temp: 22, humidity: 45 },
              wind: { speed: 5.5 }
            };
            resolve(dummyData);
          }
        }, 1000);
      });

      try {
        const data = await simulateApiCall;
        renderWeather(data);
      } catch (err) {
        showError();
      }
    }

    function renderWeather(data) {
      statusMessage.classList.add('hidden');
      errorMessage.classList.add('hidden');
      weatherResult.classList.remove('hidden');

      document.getElementById('cityName').textContent = `${data.name}, ${data.sys.country}`;
      document.getElementById('weatherDescription').textContent = data.weather[0].description;
      document.getElementById('temperature').textContent = `${Math.round(data.main.temp)}°C`;
      document.getElementById('humidity').textContent = `${data.main.humidity}%`;
      document.getElementById('windSpeed').textContent = `${data.wind.speed} m/s`;
    }

    // UI HELPERS
    function showLoading() {
      statusMessage.classList.remove('hidden');
      errorMessage.classList.add('hidden');
      weatherResult.classList.add('hidden');
    }

    function showError() {
      statusMessage.classList.add('hidden');
      errorMessage.classList.remove('hidden');
      weatherResult.classList.add('hidden');
    }
</script>
</body>
</html>
